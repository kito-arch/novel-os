services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: novelos
      POSTGRES_USER: novelos
      POSTGRES_PASSWORD: novelos
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novelos"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgres://novelos:novelos@db:5432/novelos
    command: sh -c "npm ci --prefer-offline && npm run db:migrate"
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://novelos:novelos@db:5432/novelos
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  db_data:
